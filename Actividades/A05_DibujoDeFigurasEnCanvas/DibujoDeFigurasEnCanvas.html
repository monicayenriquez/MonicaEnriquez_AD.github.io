      function dibujarEstrella(context, x, y) {
          context.save();
          context.strokeStyle = "rgba(225, 251, 255, 1)";
          context.fillStyle = "rgba(225, 251, 255, 1)";
          context.lineWidth = 1;
          context.lineCap = "round";
          context.lineJoin = "round";

          context.beginPath();
          context.moveTo(x, y);                                                    // punta superior
          context.bezierCurveTo(x + 2.5, y + 10, x + 2.5, y + 10, x + 7.5, y + 11.25);   // punta derecha
          context.bezierCurveTo(x + 2.5, y + 12.5, x + 2.5, y + 12.5, x, y + 22.5);      // punta inferior
          context.bezierCurveTo(x - 2.5, y + 12.5, x - 2.5, y + 12.5, x - 7.5, y + 11.25); // punta izquierda
          context.bezierCurveTo(x - 2.5, y + 10, x - 2.5, y + 10, x, y);                 // vuelta a la superior
          context.closePath();
          context.fill();
          context.stroke();
          context.restore();
      }

      for (var i = 0; i < points.length; i++) {
          dibujarEstrella(context, points[i].x, points[i].y);
      }

      //VENTANAS_CASA
        function dibujarRectanguloConGradienteVENTANAS(context, x, y, ancho, alto, colorInicio, colorFin) {
            context.save();
            context.strokeStyle = "rgba(177, 80, 80, 1)";
            context.lineWidth = 4;
            context.lineJoin = "round";
            context.lineCap = "round";

            context.beginPath();
            context.moveTo(x,y);
            context.lineTo(x+ancho,y);
            context.lineTo(x+ancho,y+alto);
            context.lineTo(x,y+alto);
            context.lineTo(x,y);

            // El gradiente se calcula relativo al rectángulo
            const gradiente = context.createLinearGradient(x - 20, y - 20, x + ancho, y + alto);
            gradiente.addColorStop(0, colorInicio);
            gradiente.addColorStop(1, colorFin);

            context.fillStyle = gradiente;
            context.fillRect(x, y, ancho, alto);
            context.stroke();

            context.restore();
        }

        //LUNA & SPOTS
        function dibujarCirculoConGradienteLUNA(context, x, y, radio) {
            context.save();
            
            // Círculo de inicio del gradiente (más pequeño o desplazado)
            let c1 = { x: x - radio, y: y + radio, radius: 0 };
            // Círculo final del gradiente
            let c2 = { x: x, y: y, radius: radio * 2 };
            
            let gradient = context.createRadialGradient(c1.x, c1.y, c1.radius, c2.x, c2.y, c2.radius);
            
            gradient.addColorStop(1, 'rgba(225, 251, 255, 1)');
            gradient.addColorStop(0, 'rgba(200, 249, 255, 0)');
            
            context.fillStyle = gradient;
            context.beginPath();
            context.arc(x, y, radio, 0, Math.PI * 2, true);
            context.fill();
            
            context.restore();
        }
