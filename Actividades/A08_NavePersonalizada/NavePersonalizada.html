<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Nave Personalizada</title>
    <link rel="stylesheet" href="styleNavecita.css">
  </head>
  <body>
    <header>MonicaEnriquez_AD | 34574 | IDGD V</header>
    <h1>Exploring the Vast Space</h1>
    <canvas id="canvas" width="900" height="525"></canvas>
    
    <button onclick="window.location.href='https://monicayenriquez.github.io/MonicaEnriquez_AD.github.io/'">Regresar a INDEX</a>

    <script src="utilsNavecita.js"></script>
    <script src="utilsStar.js"></script>
    <script src="Ship.js"></script>
    <script src="Star.js"></script>
    <script>
    window.onload = function () {
      var canvas = document.getElementById('canvas'),
          context = canvas.getContext('2d'),
          ship = new Ship(),
          vr = 0,
          vx = 0,
          vy = 0,
          thrust = 0,
          friction = 0.97;

      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;

      // --- Teclado ---
      window.addEventListener('keydown', function (event) {
        switch (event.keyCode) {
          case 37: vr = -3; break;                               // left
          case 39: vr = 3; break;                                // right
          case 38: thrust = 0.05; ship.showFlame = true; break;  // up
        }
      }, false);

      window.addEventListener('keyup', function (event) {
        switch (event.keyCode) {
          case 37:
          case 39:
            vr = 0;
            break;
          case 38:
            thrust = 0;
            ship.showFlame = false;
            break;
        }
      }, false);

      // Un click en el canvas "desbloquea" el audio en el navegador
      canvas.addEventListener('click', function () {
        var p = audioColision.play();
        if (p !== undefined) {
          p.then(function () {
            audioColision.pause();
            audioColision.currentTime = 0;
          }).catch(function () {});
        }
      }, false);

      // --- Estrellas ---
      var coordenadas = [  
        { x: 78,  y: 64  },
        { x: 571, y: 46  },
        { x: 398, y: 158 },
        { x: 664, y: 182 },
        { x: 60,  y: 266 },
        { x: 546, y: 300 },
        { x: 380, y: 436 },
        { x: 620, y: 412 }
      ];

      var coordenadasB = [  
        { x: 318, y: 92  },
        { x: 803, y: 88  },
        { x: 172, y: 176 },
        { x: 842, y: 246 },
        { x: 286, y: 318 },
        { x: 748, y: 338 },
        { x: 150, y: 420 },
        { x: 838, y: 440 }
      ];

      var opcionesA = { rangeScale: 0.4, speedScale: 0.04, centerScale: 1,   desfase: 0.5 };
      var opcionesB = { rangeScale: 0.3, speedScale: 0.04, centerScale: 0.5, desfase: 0.5 };

      var estrellasA = crearEstrellasEnCoordenadas(coordenadas, opcionesA);
      var estrellasB = crearEstrellasBEnCoordenadas(coordenadasB, opcionesB);

      function dibujarTexto(context) {
        context.save();
        context.font = "15px Asap, sans-serif";
        context.fillStyle = "#F8F254";
        context.textAlign = "center";
        context.textBaseline = "bottom";
        context.fillText("Press left and right arrow keys to rotate ship, up to add thrust.", canvas.width / 2, 500);
        context.restore();
      }

      // --- Loop principal (uno solo) ---
      (function drawFrame() {
        window.requestAnimationFrame(drawFrame);
        context.clearRect(0, 0, canvas.width, canvas.height);

        // Movimiento de la nave
        ship.rotation += vr * Math.PI / 180;
        vx += Math.cos(ship.rotation) * thrust;
        vy += Math.sin(ship.rotation) * thrust;
        vx *= friction;
        vy *= friction;
        ship.x += vx;
        ship.y += vy;

        // Screen wrapping
        var left = 0, right = canvas.width, top = 0, bottom = canvas.height;
        if (ship.x - ship.width / 2 > right) {
          ship.x = left - ship.width / 2;
        } else if (ship.x + ship.width / 2 < left) {
          ship.x = right + ship.width / 2;
        }
        if (ship.y - ship.height / 2 > bottom) {
          ship.y = top - ship.height / 2;
        } else if (ship.y + ship.height / 2 < top) {
          ship.y = bottom + ship.height / 2;
        }

        // Dibujo
        dibujarEstrellas(context, estrellasA);
        dibujarEstrellasB(context, estrellasB);
        ship.draw(context);

        // Colisiones con audio
        revisarColisionConAudio(ship, estrellasA);
        revisarColisionConAudioB(ship, estrellasB);

        dibujarTexto(context);
      }());
    };
    </script>
  </body>
</html>
