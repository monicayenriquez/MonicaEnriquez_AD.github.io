		<script src="keycodes.js"></script>
		<script>
			window.onload=function(){
				var canvas = document.getElementById("canvas");
				var context = canvas.getContext("2d");

				var x= 325;
				var y= 237.25;

				context.font = "bold 15px Inter";
				context.fillStyle='rgba(0,0,0,1)';
				context.fillText("Fatson Todd te observa fijamente...", x-23, y-40);
				
				var imagen1 = new Image();
				var imagen2 = new Image();
				var imagen3 = new Image();
				var imagen4 = new Image();
				var imagen5 = new Image();
				imagen1.src = "FT_Cabeza.png";
				imagen2.src = "FT_Booooo.png";
				imagen3.src = "FT_LET'S GOOOOO.png";
				imagen4.src = "FT_OK....png";
				imagen5.src = "FT_YIKESSS.png";
				imagen1.onload = function() {
					context.drawImage(imagen1, x, y, 150, 125.5);
				};
				
				context.fillRect(x+40, y+150, 75, 75);

				function onKeyboardEvent (event) {
					switch (event.keyCode) {
					case keycode.UP:
					console.log("up!");
					context.clearRect(0, 0, innerWidth, innerHeight);
					y -= 5;
				context.fillRect(x+40, y+150, 75, 75);
					break;
					case keycode.DOWN:
					console.log("down!");
					context.clearRect(0, 0, innerWidth, innerHeight);
					y += 5;
				context.fillRect(x+40, y+150, 75, 75);
					break;
					case keycode.LEFT:
					console.log("left!");
					context.clearRect(0, 0, innerWidth, innerHeight);
					x -= 5;
				context.fillRect(x+40, y+150, 75, 75);
					break;
					case keycode.RIGHT:
					console.log("right!");
					context.clearRect(0, 0, innerWidth, innerHeight);
					x += 5;
				context.fillRect(x+40, y+150, 75, 75);
					break;
					case keycode.SPACE:
					console.log("Jump!");
					context.clearRect(0, 0, innerWidth, innerHeight);
					context.fillText("Dissapproved !!!", x+75, y-50);
					context.drawImage(imagen2, x, y, 212.7, 228.7);
					break;
					case keycode.A:
					console.log("Letra A");
					context.clearRect(0, 0, innerWidth, innerHeight);
					context.fillText("Approved >;D !!!", x+45, y-50);
					context.drawImage(imagen3, x, y, 230.3, 240);
					break;
					case keycode.S:
					console.log("Letra S");
					context.clearRect(0, 0, innerWidth, innerHeight);
					context.fillText("So, you are playing with me?", x+5, y-50);
					context.drawImage(imagen4, x, y, 189, 213.3);
					break;
					case keycode.D:
					console.log("Letra D");
					context.clearRect(0, 0, innerWidth, innerHeight);
					context.fillText("Do you wanna fight me?", x+10, y-50);
					context.drawImage(imagen5, x, y, 217.7, 208.7);
					break;
					case keycode.J:
					console.log("Letra J");
					context.clearRect(0, 0, innerWidth, innerHeight);
					context.fillText("Jokes on you!", x+80, y-50);
					context.drawImage(imagen2, x, y, 212.7, 228.7);
					break;
					case keycode.F:
					console.log("Letra F");
					context.clearRect(0, 0, innerWidth, innerHeight);
					context.fillText("Nice to see you again, or is it?", x-15, y-50);
					context.drawImage(imagen1, x, y, 150, 125.5);
					break;
					default:
					console.log(event.keyCode);
					}
				}

				window.addEventListener('keydown', onKeyboardEvent, false);

			};

		</script>
