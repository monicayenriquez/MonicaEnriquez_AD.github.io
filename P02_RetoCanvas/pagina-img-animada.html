<!doctype html>
<html>
 <head>
   <meta charset="utf-8">
   <title>Bat Signal con animación de desplazamiento en un canvas</title>
   <style>
    body{
        text-align: center;
        h1 {
            background-color:rgb(0, 0, 0);
            color:rgb(255, 255, 255);
            text-align: center;
            font-family: "Asap", sans-serif;
            font-style: Medium 500;
            font-size: 200x;
            padding-bottom: 0.5%;
            padding-top: 0.5%;
        }
    }
    canvas{
        border: 2px solid #5e5e5e;
        background-color: rgb(0, 0, 0);
    }
    </style>
    <script>
        var x=Math.random() * 400;
        var y=Math.random() * 300;
        var dy=2;
        var dx=2;
        var imagen= new Image();
        imagen.src = "BatSignalPng.png"; 

        function animate(){
            requestAnimationFrame(animate);
            var canvas = document.getElementById("micanvas");
            var context = canvas.getContext("2d");
            context.clearRect(0, 0, innerWidth, innerHeight);
            context.drawImage(imagen, x, y, 150, 150); //no se necesita la función de image.onload
            if (x > 650 || x < 0){
                dx= -dx;
            }
            if (y > 450 || y < 0){
                dy= -dy;
            }
           x+=dx;
           y+=dy;
        }
        animate();

    </script>
</head>
<body>
    <h1>Bat Signal con animación de desplazamiento en un canvas</h1>
    <canvas id="micanvas" width="800" height="600"></canvas>
</body>
</html>
